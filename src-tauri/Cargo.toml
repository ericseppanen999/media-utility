[package]
name = "media-utility"
version = "0.1.0"
edition = "2021"

[lib]
name = "media_utility"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
url = "2"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "media-utility"
path = "src/main.rs"
required-features = ["desktop"]
